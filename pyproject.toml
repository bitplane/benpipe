[project]
name = "benpipe"
description = "Convert between JSON and bencode"
version = "0.1.1"
authors = [
    { name = "Gareth Davidson", email = "gaz@bitplane.net" }
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "coverage",
    "pytest-cov",
    "hypothesis",
    "build",
    "twine",
    "ruff",
    "pydoc-markdown"
]

[project.scripts]
benpipe = "benpipe:main"

[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core >=3.2,<4"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
